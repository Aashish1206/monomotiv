<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="monomotiv — Minimalist monochrome & dark aesthetic car rental experience. Pilot terminal authentication.">
  <meta name="theme-color" content="#080808">
  <title>monomotiv — Pilot Terminal Authentication</title>

  <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-obsidian text-offwhite antialiased selection:bg-white selection:text-black min-h-screen flex flex-col justify-between">

  <!-- Ambient Obsidian Background Noise & Geometric Grid -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="ambient-glow ambient-glow-top"></div>
    <div class="ambient-glow ambient-glow-center"></div>
    <div class="ambient-grid"></div>
  </div>

  <!-- Header Coordinate Strip -->
  <header class="relative z-10 w-full px-6 py-5 flex items-center justify-between font-mono text-[11px] text-muted">
    <a href="/#fleet" class="text-white font-extrabold hover:text-offwhite transition-colors tracking-widest uppercase">
      ← Return to Registry
    </a>
    <div class="hidden sm:flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full dot-circle bg-emerald-400"></span>
      <span>TERMINAL PROTOCOL: 0xAUTH-256</span>
    </div>
  </header>

  <!-- Main Login Container (Centered) -->
  <main class="relative z-10 flex-1 flex flex-col justify-center items-center px-4 py-8">
    <div class="w-full max-w-md">

      <!-- Top Centered Brand Typography: "monomotiv" in the center up -->
      <div class="text-center mb-10">
        <div
          class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded bg-surface border border-subtle text-[11px] font-mono text-muted uppercase tracking-wider mb-4 shadow-sm">
          <span class="w-1.5 h-1.5 rounded-full dot-circle bg-emerald-400"></span>
          <span>TERMINAL SECURITY GATEWAY // AUTH-01</span>
        </div>

        <h1 class="text-5xl sm:text-6xl font-extrabold text-white tracking-tight lowercase font-sans select-none my-1">
          monomotiv
        </h1>

        <p class="text-xs font-mono text-muted uppercase tracking-widest mt-2">
          Obsidian Pilot Credentials &amp; Telemetry Gateway
        </p>
      </div>

      <!-- Center Login Section Card: Directly below the brand name -->
      <div class="login-card rounded-2xl p-6 sm:p-8 relative">

        <!-- Architectural corner accents -->
        <div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-white/50"></div>
        <div class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-white/50"></div>
        <div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-white/50"></div>
        <div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-white/50"></div>

        <!-- Auth Mode Tabs -->
        <div class="flex border-b border-subtle mb-6">
          <button type="button" id="tab-login" class="login-tab-btn active">Pilot Sign In</button>
          <button type="button" id="tab-register" class="login-tab-btn">Enroll New Pilot</button>
        </div>

        <!-- Form Alert / Notice -->
        <div id="auth-alert" class="hidden mb-4 p-3 rounded text-xs font-mono border"></div>

        <!-- Login Form -->
        <form id="standalone-auth-form" class="space-y-4">
          <div>
            <label for="auth-email" class="text-[11px] font-mono text-muted uppercase tracking-wider block mb-1.5">
              Pilot Identifier / Email
            </label>
            <input type="email" id="auth-email" required placeholder="pilot@monomotiv.in" autocomplete="email"
              class="login-input">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="auth-password" class="text-[11px] font-mono text-muted uppercase tracking-wider block">
                Security Passkey
              </label>
              <button type="button" id="toggle-passkey"
                class="text-[10px] font-mono text-muted hover:text-white uppercase transition-colors bg-transparent border-0 cursor-pointer">
                Show
              </button>
            </div>
            <input type="password" id="auth-password" required placeholder="••••••••••••"
              autocomplete="current-password" class="login-input">
          </div>

          <!-- Optional Name for Enrollment -->
          <div id="name-group" class="hidden">
            <label for="auth-name" class="text-[11px] font-mono text-muted uppercase tracking-wider block mb-1.5">
              Pilot Legal Call-Sign / Name
            </label>
            <input type="text" id="auth-name" placeholder="Primary Operator" class="login-input">
          </div>

          <!-- Session Persistence -->
          <div class="flex items-center justify-between pt-1 font-mono text-xs">
            <label class="flex items-center gap-2 cursor-pointer text-muted select-none hover:text-offwhite">
              <input type="checkbox" id="auth-persist" checked class="custom-checkbox">
              <span>Persist Session</span>
            </label>
            <button type="button" id="btn-recovery"
              class="text-muted hover:text-white transition-colors bg-transparent border-0 cursor-pointer text-[11px]">
              Reset Passkey
            </button>
          </div>

          <!-- Submit CTA Button -->
          <div class="pt-3">
            <button type="submit" id="auth-submit-btn"
              class="w-full h-12 rounded bg-white text-black font-extrabold text-xs font-mono uppercase tracking-widest hover:bg-offwhite active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer border-0 shadow-lg">
              <span id="auth-submit-text">Authorize Terminal Access</span>
              <svg class="w-4 h-4 text-black flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </button>
          </div>
        </form>

        <!-- Security Encryption Directive -->
        <div class="mt-6 pt-4 border-t border-subtle flex items-center justify-between text-[10px] font-mono text-muted">
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full dot-circle bg-emerald-400"></span>
            <span>SHA-256 SECURED</span>
          </div>
          <span>TLS 1.3 // ISO-27001</span>
        </div>

      </div>

      <!-- Navigation Link below Card: Return to Fleet -->
      <div class="mt-8 text-center">
        <a href="/#fleet"
          class="inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-muted hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          <span>Return to Fleet Showcase</span>
        </a>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="relative z-10 w-full py-6 px-6 text-center text-[10px] font-mono text-muted border-t border-subtle">
    © 2026 MONOMOTIV COLLECTIVE. ALL RIGHTS RESERVED.
  </footer>

  <script>
    (function() {
      let mode = 'login';
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const nameGroup = document.getElementById('name-group');
      const submitText = document.getElementById('auth-submit-text');
      const submitBtn = document.getElementById('auth-submit-btn');
      const authForm = document.getElementById('standalone-auth-form');
      const authAlert = document.getElementById('auth-alert');
      const togglePass = document.getElementById('toggle-passkey');
      const passInput = document.getElementById('auth-password');
      const emailInput = document.getElementById('auth-email');
      const nameInput = document.getElementById('auth-name');
      const persistCheck = document.getElementById('auth-persist');

      function showAlert(msg, isSuccess = false) {
        authAlert.textContent = msg;
        authAlert.className = isSuccess
          ? 'mb-4 p-3 rounded text-xs font-mono border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 block'
          : 'mb-4 p-3 rounded text-xs font-mono border border-red-500/30 bg-red-500/10 text-red-400 block';
        authAlert.classList.remove('hidden');
      }

      tabLogin.addEventListener('click', () => {
        mode = 'login';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        nameGroup.classList.add('hidden');
        submitText.textContent = 'Authorize Terminal Access';
        authAlert.classList.add('hidden');
      });

      tabRegister.addEventListener('click', () => {
        mode = 'register';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        nameGroup.classList.remove('hidden');
        submitText.textContent = 'Enroll New Pilot Profile';
        authAlert.classList.add('hidden');
      });

      togglePass.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        togglePass.textContent = isPass ? 'Hide' : 'Show';
      });

      document.getElementById('btn-recovery').addEventListener('click', () => {
        showAlert('Terminal Protocol: Contact 24/7 Concierge at +91 800-555-0199 for token reset.');
      });

      authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passInput.value;
        const name = nameInput.value.trim();

        if (!email || !password) {
          showAlert('Email and passkey are required.');
          return;
        }

        submitBtn.disabled = true;
        submitText.textContent = 'Authenticating Terminal...';

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name, mode })
        })
        .then(r => r.json())
        .then(data => {
          if (data && data.success) {
            if (persistCheck.checked) {
              try { localStorage.setItem('monomotiv_pilot', JSON.stringify(data.user)); } catch(_) {}
            }
            showAlert('✓ Terminal Authorized. Redirecting to Fleet...', true);
            setTimeout(() => {
              window.location.href = '/#fleet';
            }, 800);
          } else {
            showAlert(data.message || 'Authentication rejected. Verify passkey.');
          }
        })
        .catch(err => {
          console.error(err);
          const offlineUser = { email, name: name || email.split('@')[0].toUpperCase(), role: 'Operator' };
          if (persistCheck.checked) {
            try { localStorage.setItem('monomotiv_pilot', JSON.stringify(offlineUser)); } catch(_) {}
          }
          showAlert('✓ Local Terminal Clearance Granted. Redirecting...', true);
          setTimeout(() => { window.location.href = '/#fleet'; }, 800);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitText.textContent = mode === 'login' ? 'Authorize Terminal Access' : 'Enroll New Pilot Profile';
        });
      });
    })();
  </script>
</body>

</html>
